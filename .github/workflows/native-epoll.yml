name: native Linux epoll

on:
  push:
  pull_request:

jobs:
  epoll-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile native shim with warnings as errors
        run: gcc -std=c11 -O2 -Wall -Wextra -Werror tests/native/epoll_smoke.c shim/epoll.c -o /tmp/goose-io-epoll-smoke
      - name: Exercise Linux epoll and nonblocking TCP primitives
        run: /tmp/goose-io-epoll-smoke
