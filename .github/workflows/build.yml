# The build of goose-io on one platform, called by one workflow for each platform (ci-linux-x64.yml and the others), so
# that each platform has its own status and its own badge in the README. goose-io is pure Goose, so every build runs
# the same checks with the Goose release for its platform: the contract compiles, the tests and the conformance suite
# (the core and each group) pass on the in-memory event loop and on the wrapper over it, the core passes on a loop that
# supplies nothing else, every check is shown to fail against its fault, the example libraries name what they need, the
# documents agree with the code, and the old words stay out. The commands are the ones CONTRIBUTING.md lists.
name: build

on:
  workflow_call:
    inputs:
      name:
        description: The platform, as it is named in the README
        required: true
        type: string
      os:
        description: The runner label
        required: true
        type: string
      goose:
        description: The Goose release asset for the platform
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.name }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    steps:
      # Avoid checkout converting LF sources to CRLF: Goose's formatter checks repository bytes, and the quoted
      # code of the documents is compared byte for byte with the files.
      - name: Preserve LF line endings on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6

      - name: Install Goose
        shell: bash
        env:
          ASSET: ${{ inputs.goose }}
        run: |
          set -euo pipefail
          tag=$(sed -n 's/.*goose-\(v[0-9.]*\)-.*/\1/p' <<< "$ASSET")
          url="https://github.com/aardappel/goose/releases/download/$tag/$ASSET"
          mkdir -p "$RUNNER_TEMP/goose"
          curl -fsSL --proto '=https' --tlsv1.2 "$url" -o "$RUNNER_TEMP/$ASSET"
          if [[ "$ASSET" == *.zip ]]; then
            unzip -q -o "$RUNNER_TEMP/$ASSET" -d "$RUNNER_TEMP/goose"
          else
            tar -xzf "$RUNNER_TEMP/$ASSET" -C "$RUNNER_TEMP/goose"
          fi
          bin=$(find "$RUNNER_TEMP/goose" -maxdepth 3 \( -name goose -o -name goose.exe \) -type f | head -1)
          test -n "$bin"
          chmod +x "$bin" 2>/dev/null || true
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
          "$bin" version

      - name: Typecheck the contract
        shell: bash
        run: goose check goose_io.goose

      - name: Format check
        shell: bash
        run: goose format --check .

      - name: Unit, driver and example tests (and the purity check)
        shell: bash
        run: bash tests/run_tests.sh

      - name: Code quoted in the documents is the code in the repository
        shell: bash
        run: bash tests/checks/docs.sh

      - name: Conformance suite on the in-memory event loop (the core and each group)
        shell: bash
        run: bash tests/conformance/run.sh --repeat 3

      - name: Core of the suite on an event loop that supplies only the core
        shell: bash
        run: bash tests/conformance/run.sh --core-only

      - name: Conformance suite on the wrapper over it
        shell: bash
        run: bash tests/conformance/run.sh --wrapped

      - name: Every check fails against its fault
        shell: bash
        run: bash tests/conformance/faults.sh

      - name: Specification, table and suite agree
        shell: bash
        run: bash tests/conformance/table_check.sh

      - name: Every check is in the group of the operations it calls
        shell: bash
        run: bash tests/conformance/groups_check.sh

      - name: Example libraries over the wrapper
        shell: bash
        run: bash tests/examples/over_wrapper.sh

      - name: Example libraries import only the contract
        shell: bash
        run: bash tests/examples/imports_test.sh

      - name: Example libraries name the groups they need
        shell: bash
        run: bash tests/examples/needs_check.sh

      - name: Event loop mappings are complete
        shell: bash
        run: bash tests/checks/event_loops.sh

      - name: The layout listed in the README is the layout
        shell: bash
        run: bash tests/checks/layout.sh

      - name: The old vocabulary stays out
        shell: bash
        run: bash tests/checks/vocabulary.sh

      # fifty repetitions: a check that fails once in any of them fails the run (docs/event-loops.md)
      - name: Fifty repetitions of the suite
        if: runner.os == 'Linux'
        shell: bash
        run: bash tests/conformance/run.sh --repeat 50
