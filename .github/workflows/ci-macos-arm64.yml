# The build of goose-io on macos-arm64 (build.yml has the steps). One run for each commit: a branch is built when it has a pull
# request, and main is built when it changes. A push and a pull_request run of the same commit would be two sets of
# jobs, and the macOS arm64 runners are scarce enough (GitHub: "jobs targeting macOS arm64 runners may experience
# longer queue times") that the second set can be cancelled while it waits for one. A newer push to the same branch
# cancels the run it supersedes. A change to Markdown files only is not built.
# not `macos-15`: this repository is private, and a job on that label is never picked up (it stays queued);
# `macos-26` is an arm64 image and starts at once (checked with a probe, 2026-11-16)
name: macos-arm64

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: macos-arm64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      name: macos-arm64
      os: macos-26
      goose: goose-v2026.4-macos-arm64.tar.gz
